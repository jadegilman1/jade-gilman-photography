<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="description" content="Curated photography collections by Jade Gilman">
    <meta name="format-detection" content="telephone=no">
    <title>JADE GILMAN | Fine Art Photography</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <!-- Preload critical data so app.js hits cache -->
    <link rel="preload" href="images/galleries.json" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="secrets.json" as="fetch" crossorigin="anonymous">
    
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Masonry Layout Library -->
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js" defer></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js" defer></script>
    
    <style>
        /* Critical inline styles for fast first paint - must match styles.css */
        :root {
            --canvas: #f7f3eb;
            --ink: #0f1118;
            --accent: #c7a36a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            line-height: 1.6;
            color: var(--ink);
            background-color: var(--canvas);
            -webkit-font-smoothing: antialiased;
        }
        .navbar {
            padding: 1.4rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Bodoni Moda', serif;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--ink);
            text-transform: uppercase;
        }
        .navbar a {
            text-decoration: none;
            color: inherit;
        }
        .skeleton {
            background: linear-gradient(90deg, #f0e9df 25%, #e8e5dc 50%, #f0e9df 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.8s infinite;
            border-radius: 8px;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
    
    <!-- Main Stylesheet - Load normally for local dev, preload for production -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Font Awesome - Load normally for compatibility -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="hero">
        <nav class="navbar">
            <a href="https://jade-gilman-photography.web.app/" target="_blank">
                <h1 class="logo">JADE GILMAN</h1>
            </a>
            <span class="nav-pill">Fine art photography</span>
        </nav>
    </header>

    <main class="container">
        <section class="portfolio-section">
            <h2 class="section-title">Collections</h2>
            <div class="grid albums-grid" id="albumsGrid"></div>
        </section>
    </main>

    <div class="modal" id="passwordModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>Collection Authentication</h3>
                <button class="icon-btn" onclick="closePasswordPrompt()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="password" id="albumPasscodeInput" class="input-field" 
                       placeholder="Enter curatorial passcode">
                <div id="passwordError" class="error-message"></div>
            </div>
            <div class="modal-footer">
                <button onclick="checkAlbumPasscode()" class="btn btn-primary">
                    Unlock Archive
                </button>
            </div>
        </div>
    </div>
    <div id="galleryContainer" class="gallery-container"></div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-overlay" onclick="closeModal()"></div>
        <button class="lightbox-close" onclick="closeModal()" aria-label="Close lightbox">
            <i class="fas fa-times"></i>
        </button>
        <div class="lightbox-container">
            <button class="lightbox-nav lightbox-nav-prev" onclick="navigatePhoto(-1)" aria-label="Previous image">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="lightbox-content">
                <div class="lightbox-image-wrapper">
                    <img id="lightboxImage" class="lightbox-img" alt="Gallery photo">
                    <div class="lightbox-loader">
                        <div class="loader-spinner"></div>
                    </div>
                </div>
            </div>
            <button class="lightbox-nav lightbox-nav-next" onclick="navigatePhoto(1)" aria-label="Next image">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        <div class="lightbox-footer">
            <div class="lightbox-counter">
                <span id="lightboxCounter">1 / 1</span>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p class="footer-text">Made with <a href="https://solanaceae.xyz/" target="_blank" style="color: red; text-decoration: none;">&hearts;</a></p>
    </footer>

    <!-- JavaScript (defer for performance, but works in all environments) -->
    <script src="app.js"></script>
</body>
</html>
